name: Deploy reviewed edge release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    # Create this environment with required reviewers and restrict eligible branches.
    environment: edge-production
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          REVISION: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$TARGET" "cd /opt/nasa-challenge && git fetch origin && git checkout --detach '$REVISION' && IMAGE_TAG='$REVISION' bash scripts/deploy.sh"
