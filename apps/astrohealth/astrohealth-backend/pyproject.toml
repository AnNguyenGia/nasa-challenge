[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrohealth-backend"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "PyYAML>=6,<7", "argon2-cffi>=23", "PyJWT>=2.9,<3", "uuid6>=2024", "zstandard>=0.23", "cryptography>=44", "numpy>=2", "onnxruntime>=1.20", "onnx>=1.17", "duckdb>=1.1", "pyarrow>=18", "aiomqtt>=2,<3", "reportlab>=4"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx", "ruff", "mypy", "types-PyYAML", "locust"]
xai = ["shap", "captum", "torch"]
encrypted = ["sqlcipher3-binary; sys_platform == 'linux'"]
sensors = ["pyserial", "bleak"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
strict = true
ignore_missing_imports = true
